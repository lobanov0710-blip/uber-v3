name: ARCH-11.15B2 Production Rollout

on:
  push:
    branches:
      - ops/arch-11-15b2-deploy

permissions:
  contents: read

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout merged backend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm ci

      - name: Re-run backend tests
        run: npm test

      - name: List pending production D1 migrations
        run: npx wrangler d1 migrations list DB --remote

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Confirm no pending production D1 migrations
        run: npx wrangler d1 migrations list DB --remote

      - name: Verify staff_push_devices table
        run: >
          npx wrangler d1 execute DB --remote
          --command "SELECT COUNT(*) AS table_count FROM sqlite_master WHERE type='table' AND name='staff_push_devices';"

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify Worker health
        shell: bash
        run: |
          body="$(curl --fail --silent --show-error https://uber-v3.lobanov0710.workers.dev/)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"service":"uber-v3-pro"'

      - name: Verify push endpoint is private
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /tmp/push-response.json --write-out "%{http_code}" --request PUT https://uber-v3.lobanov0710.workers.dev/staff/push-device)"
          cat /tmp/push-response.json
          test "$status" = "401"
