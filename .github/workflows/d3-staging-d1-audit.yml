name: D3 staging D1 migration audit

on:
  push:
    branches:
      - 'probe/d3-staging-inventory'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Create read-only staging config
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wrangler.d3-staging-readonly.toml <<'TOML'
          name = "uber-v3-staging"
          main = "src/index.js"
          compatibility_date = "2026-06-01"
          workers_dev = true

          [[kv_namespaces]]
          binding = "DRIVERS"
          id = "b8fdeb74fda8415ab06b3b1c86c78e8f"

          [[d1_databases]]
          binding = "DB"
          database_name = "transfer-servis52-staging"
          database_id = "66474481-a123-47f9-81b4-12af7565ec8d"
          migrations_dir = "migrations"

          [vars]
          APP_ENV = "staging"
          TOML

      - name: List remote staging D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 d1 migrations list DB             --remote             --config /tmp/wrangler.d3-staging-readonly.toml             > /tmp/migrations.txt

          cat /tmp/migrations.txt

          python3 - <<'PY'
          import re
          raw=open('/tmp/migrations.txt',encoding='utf-8',errors='replace').read()
          names=sorted(set(re.findall(r'\b\d{4}_[A-Za-z0-9_.-]+\.sql\b',raw)))
          print('REMOTE_MIGRATION_NAMES=' + repr(names))
          for required in ('0016_photo_control_support_hardening.sql','0017_photo_check_lifecycle.sql'):
              print(required + '=' + ('VISIBLE' if required in names else 'NOT_VISIBLE'))
          PY

      - name: Confirm no remote mutation command was used
        shell: bash
        run: |
          echo 'REMOTE_MUTATIONS=NONE'
