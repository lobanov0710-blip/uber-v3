name: D3 staging D1 migration audit

on:
  push:
    branches:
      - 'probe/d3-staging-inventory'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Audit pending D3 migrations for destructive SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re

          root=pathlib.Path('migrations')
          files=[]
          for number in range(5,18):
              matches=sorted(root.glob(f'{number:04d}_*.sql'))
              if len(matches)!=1:
                  raise SystemExit(f'MIGRATION_CHAIN_INVALID={number:04d}')
              files.append(matches[0])

          destructive=[]
          unsafe_alter=[]
          alter_count=0

          for path in files:
              sql=path.read_text(encoding='utf-8')
              sql=re.sub(r'/\*.*?\*/','',sql,flags=re.S)
              sql=re.sub(r'--[^\n]*','',sql)
              for raw in sql.split(';'):
                  stmt=' '.join(raw.split()).strip()
                  if not stmt:
                      continue
                  upper=stmt.upper()
                  first=upper.split(None,1)[0]
                  if first in {'DROP','DELETE','UPDATE','INSERT','REPLACE','TRUNCATE'}:
                      destructive.append((path.name,stmt[:220]))
                  if upper.startswith('ALTER TABLE'):
                      alter_count+=1
                      if ' ADD COLUMN ' not in f' {upper} ':
                          unsafe_alter.append((path.name,stmt[:220]))

          print(f'PENDING_MIGRATIONS={len(files)}')
          print(f'ALTER_ADD_COLUMN_COUNT={alter_count}')
          print(f'DESTRUCTIVE_STATEMENTS={len(destructive)}')
          print(f'UNSAFE_ALTER_STATEMENTS={len(unsafe_alter)}')

          if destructive:
              for item in destructive:
                  print('DESTRUCTIVE=' + repr(item))
              raise SystemExit(7)

          if unsafe_alter:
              for item in unsafe_alter:
                  print('UNSAFE_ALTER=' + repr(item))
              raise SystemExit(8)

          print('D3_MIGRATION_STATIC_SAFETY=PASS')
          PY

      - name: Create read-only staging config
        shell: bash
        run: |
          set -euo pipefail
          cat > .wrangler.d3-staging-readonly.toml <<'TOML'
          name = "uber-v3-staging"
          main = "src/index.js"
          compatibility_date = "2026-06-01"
          workers_dev = true

          [[kv_namespaces]]
          binding = "DRIVERS"
          id = "b8fdeb74fda8415ab06b3b1c86c78e8f"

          [[d1_databases]]
          binding = "DB"
          database_name = "transfer-servis52-staging"
          database_id = "66474481-a123-47f9-81b4-12af7565ec8d"
          migrations_dir = "migrations"

          [vars]
          APP_ENV = "staging"
          TOML

      - name: List remote staging D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 d1 migrations list DB             --remote             --config .wrangler.d3-staging-readonly.toml             > /tmp/migrations.txt

          cat /tmp/migrations.txt

          python3 - <<'PY'
          import re
          raw=open('/tmp/migrations.txt',encoding='utf-8',errors='replace').read()
          names=sorted(set(re.findall(r'\b\d{4}_[A-Za-z0-9_.-]+\.sql\b',raw)))
          print('REMOTE_MIGRATION_NAMES=' + repr(names))
          for required in ('0016_photo_control_support_hardening.sql','0017_photo_check_lifecycle.sql'):
              print(required + '=' + ('VISIBLE' if required in names else 'NOT_VISIBLE'))
          PY

      - name: Confirm no remote mutation command was used
        shell: bash
        run: |
          echo 'REMOTE_MUTATIONS=NONE'
