name: ARCH-11.15B2 D1 smoke verification

on:
  push:
    branches:
      - ops/arch-11-15b2-deploy
    paths:
      - ".github/workflows/arch-11-15b2-d1-smoke.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout production backend
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Android push registration exists
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler d1 execute DB --remote --command "SELECT COUNT(*) AS registration_count FROM staff_push_devices WHERE installation_id = '127d9020-71e7-4b2b-a47c-222d004d07b5' AND platform = 'android';")"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq '"registration_count"[[:space:]]*:[[:space:]]*1'
