name: D3 staging schema migration simulation

on:
  push:
    branches:
      - 'probe/d3-staging-inventory'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Create read-only staging config
        shell: bash
        run: |
          set -euo pipefail
          cat > .wrangler.d3-schema-readonly.toml <<'TOML'
          name = "uber-v3-staging"
          main = "src/index.js"
          compatibility_date = "2026-06-01"
          workers_dev = true

          [[kv_namespaces]]
          binding = "DRIVERS"
          id = "b8fdeb74fda8415ab06b3b1c86c78e8f"

          [[d1_databases]]
          binding = "DB"
          database_name = "transfer-servis52-staging"
          database_id = "66474481-a123-47f9-81b4-12af7565ec8d"
          migrations_dir = "migrations"

          [vars]
          APP_ENV = "staging"
          TOML

      - name: Export remote schema only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 d1 export DB             --remote             --config .wrangler.d3-schema-readonly.toml             --output /tmp/staging-schema.sql             --no-data

          test -s /tmp/staging-schema.sql
          echo 'REMOTE_SCHEMA_EXPORT=PASS'

      - name: Simulate pending migrations locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sqlite3

          schema=pathlib.Path('/tmp/staging-schema.sql').read_text(encoding='utf-8')
          db=sqlite3.connect(':memory:')

          try:
              db.executescript(schema)
          except Exception as exc:
              raise SystemExit(f'CURRENT_SCHEMA_IMPORT=FAIL {type(exc).__name__}: {exc}')

          print('CURRENT_SCHEMA_IMPORT=PASS')

          root=pathlib.Path('migrations')
          applied=[]

          for number in range(5,18):
              matches=sorted(root.glob(f'{number:04d}_*.sql'))
              if len(matches) != 1:
                  raise SystemExit(f'MIGRATION_LOOKUP=FAIL {number:04d}')

              path=matches[0]
              sql=path.read_text(encoding='utf-8')

              try:
                  db.executescript('BEGIN;\n' + sql + '\nCOMMIT;')
              except Exception as exc:
                  try:
                      db.execute('ROLLBACK')
                  except Exception:
                      pass
                  raise SystemExit(
                      f'MIGRATION_SIMULATION=FAIL {path.name} '
                      f'{type(exc).__name__}: {exc}'
                  )

              applied.append(path.name)

          required_tables={
              'driver_profiles',
              'vehicles',
              'driver_availability',
              'order_assignments',
              'identity_verifications',
              'vehicle_photo_checks',
              'vehicle_photo_check_reviews',
              'support_cases',
              'chat_messages',
              'calls',
              'audit_events',
          }

          rows=db.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          ).fetchall()

          tables={row[0] for row in rows}
          missing=sorted(required_tables - tables)

          print('SIMULATED_MIGRATIONS=' + str(len(applied)))
          print('SIMULATED_LAST=' + applied[-1])

          if missing:
              raise SystemExit('MIGRATION_SCHEMA_MISSING=' + ','.join(missing))

          print('D3_SCHEMA_MIGRATION_SIMULATION=PASS')
          print('REMOTE_MUTATIONS=NONE')
          PY
