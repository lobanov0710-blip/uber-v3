name: Backend tests

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # node24, also used by Android CI
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, node24
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Use the verified npm version for scoped overrides
        run: npm install --global npm@11.9.0 --ignore-scripts
      - name: Install locked development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Validate D1 migrations offline
        run: python3 tools/test_migrations.py
      - name: Validate fail-closed D3 staging preflight
        run: python3 tests/d3StagingPreflight.test.py
      - name: Run backend unit and router tests
        run: npm test
      - name: Verify audit transaction with local workerd and D1
        run: node tools/check_availability_d1.mjs
      - name: Bundle Worker without deploying
        run: npm exec -- wrangler deploy --dry-run --outdir /tmp/worker-audit-bundle
