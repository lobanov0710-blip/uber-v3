name: Backend tests

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run backend unit and router tests
        run: npm test
      - name: Verify passenger push migration on local SQLite
        run: python3 tests/passengerPushMigration.sqlite.py
      - name: Verify one-use push grant and rate limit SQL locally
        run: python3 tests/passengerPushSecurity.sqlite.py
      - name: Verify FCM redaction and bounded replay retention
        run: python3 tests/passengerPushLifecycle.sqlite.py
      - name: Verify one-use HMAC nonce and cleanup on SQLite
        run: python3 tests/passengerPushNonce.sqlite.py
