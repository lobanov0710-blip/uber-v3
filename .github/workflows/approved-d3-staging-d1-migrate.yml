name: Approved D3 staging D1 migration apply

on:
  push:
    branches:
      - 'ops/d3-staging-approved-20261107'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout approved backend head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Create exact staging D1 config
        shell: bash
        run: |
          set -euo pipefail
          cat > .wrangler.d3-staging-migrate.toml <<'TOML'
          name = "uber-v3-staging"
          main = "src/index.js"
          compatibility_date = "2026-06-01"
          workers_dev = true

          [[kv_namespaces]]
          binding = "DRIVERS"
          id = "b8fdeb74fda8415ab06b3b1c86c78e8f"

          [[d1_databases]]
          binding = "DB"
          database_name = "transfer-servis52-staging"
          database_id = "66474481-a123-47f9-81b4-12af7565ec8d"
          migrations_dir = "migrations"

          [vars]
          APP_ENV = "staging"
          TOML

      - name: Verify exact pending migration set
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 d1 migrations list transfer-servis52-staging             --remote             --config .wrangler.d3-staging-migrate.toml             > /tmp/pending.txt

          python3 - <<'PY'
          import pathlib, re

          raw=pathlib.Path('/tmp/pending.txt').read_text(
              encoding='utf-8',
              errors='replace',
          )

          actual=sorted(set(
              re.findall(
                  r'\b(?:000[5-9]|001[0-7])_[A-Za-z0-9_.-]+\.sql\b',
                  raw,
              )
          ))

          root=pathlib.Path('migrations')
          expected=[]

          for number in range(5,18):
              matches=sorted(root.glob(f'{number:04d}_*.sql'))
              if len(matches) != 1:
                  raise SystemExit(
                      f'LOCAL_MIGRATION_CHAIN_INVALID={number:04d}'
                  )
              expected.append(matches[0].name)

          print('REMOTE_PENDING_COUNT=' + str(len(actual)))
          print('REMOTE_PENDING_FIRST=' + (actual[0] if actual else 'NONE'))
          print('REMOTE_PENDING_LAST=' + (actual[-1] if actual else 'NONE'))

          if actual != expected:
              print('EXPECTED=' + repr(expected))
              print('ACTUAL=' + repr(actual))
              raise SystemExit('REMOTE_PENDING_SET_MISMATCH')

          print('REMOTE_PENDING_SET=EXACT_0005_0017')
          PY

      - name: Capture pre-migration rollback capability and safe counts
        shell: bash
        run: |
          set -euo pipefail

          npx --yes wrangler@4.156.0 d1 time-travel info transfer-servis52-staging             --config .wrangler.d3-staging-migrate.toml             --json > /tmp/time-travel-before.json

          npx --yes wrangler@4.156.0 d1 execute transfer-servis52-staging             --remote             --config .wrangler.d3-staging-migrate.toml             --command "SELECT (SELECT COUNT(*) FROM orders) AS orders_count, (SELECT COUNT(*) FROM quotes) AS quotes_count"             --json > /tmp/counts-before.json

          python3 - <<'PY' > /tmp/pre.env
          import json

          def find_row(node):
              if isinstance(node, dict):
                  if 'orders_count' in node and 'quotes_count' in node:
                      return node
                  for value in node.values():
                      found=find_row(value)
                      if found is not None:
                          return found
              elif isinstance(node, list):
                  for value in node:
                      found=find_row(value)
                      if found is not None:
                          return found
              return None

          counts=json.load(open('/tmp/counts-before.json',encoding='utf-8'))
          row=find_row(counts)
          if row is None:
              raise SystemExit('PRE_COUNTS_UNREADABLE')

          time=json.load(open('/tmp/time-travel-before.json',encoding='utf-8'))

          def has_bookmark(node):
              if isinstance(node,dict):
                  value=node.get('bookmark')
                  if isinstance(value,str) and value:
                      return True
                  return any(has_bookmark(v) for v in node.values())
              if isinstance(node,list):
                  return any(has_bookmark(v) for v in node)
              return False

          print('ORDERS_BEFORE=' + str(int(row['orders_count'])))
          print('QUOTES_BEFORE=' + str(int(row['quotes_count'])))
          print('TIME_TRAVEL_BEFORE=' + ('YES' if has_bookmark(time) else 'NO'))
          PY

          cat /tmp/pre.env

          grep -q '^TIME_TRAVEL_BEFORE=YES$' /tmp/pre.env

      - name: Apply approved staging migrations 0005 through 0017
        shell: bash
        run: |
          set -euo pipefail

          npx --yes wrangler@4.156.0 d1 migrations apply transfer-servis52-staging             --remote             --config .wrangler.d3-staging-migrate.toml

          echo 'STAGING_D1_MIGRATIONS_APPLY_COMMAND=COMPLETED'

      - name: Verify migration state and data counts
        shell: bash
        run: |
          set -euo pipefail

          npx --yes wrangler@4.156.0 d1 migrations list transfer-servis52-staging             --remote             --config .wrangler.d3-staging-migrate.toml             > /tmp/pending-after.txt

          python3 - <<'PY'
          import pathlib, re
          raw=pathlib.Path('/tmp/pending-after.txt').read_text(
              encoding='utf-8',
              errors='replace',
          )
          pending=sorted(set(re.findall(
              r'\b\d{4}_[A-Za-z0-9_.-]+\.sql\b',
              raw,
          )))
          print('REMOTE_PENDING_AFTER=' + repr(pending))
          if pending:
              raise SystemExit('REMOTE_MIGRATIONS_STILL_PENDING')
          print('REMOTE_PENDING_AFTER_COUNT=0')
          PY

          npx --yes wrangler@4.156.0 d1 execute transfer-servis52-staging             --remote             --config .wrangler.d3-staging-migrate.toml             --command "SELECT (SELECT COUNT(*) FROM orders) AS orders_count, (SELECT COUNT(*) FROM quotes) AS quotes_count"             --json > /tmp/counts-after.json

          npx --yes wrangler@4.156.0 d1 execute transfer-servis52-staging             --remote             --config .wrangler.d3-staging-migrate.toml             --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('driver_profiles','vehicles','document_resources','driver_availability','order_assignments','identity_verifications','vehicle_photo_checks','vehicle_photo_check_reviews','staff_permissions','support_cases','chat_messages','calls','audit_events') ORDER BY name"             --json > /tmp/tables-after.json

          python3 - <<'PY'
          import json, pathlib

          before={}
          for line in pathlib.Path('/tmp/pre.env').read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  key,value=line.split('=',1)
                  before[key]=value

          def find_count_row(node):
              if isinstance(node,dict):
                  if 'orders_count' in node and 'quotes_count' in node:
                      return node
                  for value in node.values():
                      found=find_count_row(value)
                      if found:
                          return found
              elif isinstance(node,list):
                  for value in node:
                      found=find_count_row(value)
                      if found:
                          return found
              return None

          counts=json.load(open('/tmp/counts-after.json',encoding='utf-8'))
          row=find_count_row(counts)
          if row is None:
              raise SystemExit('POST_COUNTS_UNREADABLE')

          orders_after=int(row['orders_count'])
          quotes_after=int(row['quotes_count'])

          print('ORDERS_AFTER=' + str(orders_after))
          print('QUOTES_AFTER=' + str(quotes_after))

          if orders_after != int(before['ORDERS_BEFORE']):
              raise SystemExit('ORDERS_COUNT_CHANGED')
          if quotes_after != int(before['QUOTES_BEFORE']):
              raise SystemExit('QUOTES_COUNT_CHANGED')

          tables=json.load(open('/tmp/tables-after.json',encoding='utf-8'))
          names=set()

          def walk(node):
              if isinstance(node,dict):
                  name=node.get('name')
                  if isinstance(name,str):
                      names.add(name)
                  for value in node.values():
                      walk(value)
              elif isinstance(node,list):
                  for value in node:
                      walk(value)

          walk(tables)

          required={
              'driver_profiles',
              'vehicles',
              'document_resources',
              'driver_availability',
              'order_assignments',
              'identity_verifications',
              'vehicle_photo_checks',
              'vehicle_photo_check_reviews',
              'staff_permissions',
              'support_cases',
              'chat_messages',
              'calls',
              'audit_events',
          }

          missing=sorted(required - names)
          print('REQUIRED_D3_TABLES_PRESENT=' + str(len(required)-len(missing)))
          if missing:
              print('MISSING_D3_TABLES=' + repr(missing))
              raise SystemExit('D3_TABLES_MISSING')

          print('STAGING_D1_MIGRATION_VERIFICATION=PASS')
          PY
